<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📄 PRD 编写助手</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo">📄</span>
        <h1>PRD 助手</h1>
      </div>
      <button class="btn-primary" onclick="showAiGenerateModal()">🤖 AI 生成 PRD</button>
      <div class="prd-list" id="prdList"></div>
    </aside>

    <!-- 主内容 -->
    <main class="main-content" id="mainContent">
      <div class="empty-state">
        <div class="empty-icon">📄</div>
        <h2>欢迎使用 PRD 编写助手</h2>
        <p>由 AI 助力，快速生成产品需求文档</p>
        <button class="btn-primary" onclick="showAiGenerateModal()">🤖 开始生成</button>
      </div>
    </main>
  </div>

  <!-- AI 生成 PRD 弹窗 -->
  <div class="modal" id="aiGenerateModal">
    <div class="modal-content modal-content-wide">
      <div class="modal-header">
        <h2>🤖 AI 生成 PRD</h2>
        <button class="close-btn" onclick="closeModal('aiGenerateModal')">&times;</button>
      </div>
      <form id="aiGenerateForm" onsubmit="generatePrd(event)">
        <div class="form-group">
          <label>产品名称 *</label>
          <input type="text" id="aiTitle" placeholder="例如：在线商城" required>
        </div>
        <div class="form-group">
          <label>产品描述</label>
          <button type="button" id="autoDescBtn" class="btn-ghost" style="margin-bottom:8px;" onclick="autoGenerateDescription()">🤖 自动生成产品描述</button>
          <textarea id="aiDescription" rows="6" placeholder="简单描述一下这个产品要解决什么问题，有什么特点..."></textarea>
        </div>
        <div class="form-group form-tip">
          <small>💡 提示：AI 将根据你输入的信息生成一份完整的 PRD 文档</small>
        </div>
        <button type="submit" class="btn-primary" id="aiGenerateBtn">🚀 开始生成</button>
      </form>
    </div>
  </div>

  <!-- 查看 PRD 弹窗 -->
  <div class="modal" id="prdEditorModal">
    <div class="modal-content editor-modal">
      <div class="modal-header">
        <h2 id="editorTitle">PRD 文档</h2>
        <button class="close-btn" onclick="closeModal('prdEditorModal')">&times;</button>
      </div>
      <div class="editor-body" id="editorBody"></div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal confirm-modal" id="deleteConfirmModal">
    <div class="modal-content confirm-content">
      <div class="confirm-icon">🗑️</div>
      <h3>确认删除</h3>
      <p>确定要删除这个 PRD 文档吗？<br>此操作不可撤销。</p>
      <div class="confirm-actions">
        <button class="btn-secondary" onclick="cancelDelete()">取消</button>
        <button class="btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">确认删除</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
